<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS664 Blockchain Security Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .app-container { display: flex; width: 100%; max-width: 850px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; min-height: 500px; }
        
        /* Sidebar Styles */
        .sidebar { width: 250px; background: #f8fafc; border-right: 1px solid #e2e8f0; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { font-size: 18px; color: #f7931a; margin-top: 0; margin-bottom: 15px; text-align: center; }
        .lecture-list { display: flex; flex-direction: column; gap: 10px; }
        .lecture-btn { width: 100%; padding: 10px 12px; background-color: #e2e8f0; border: 2px solid transparent; border-radius: 5px; cursor: pointer; font-size: 14px; text-align: left; transition: 0.2s; font-weight: bold; }
        .lecture-btn:hover { background-color: #cbd5e1; }
        .lecture-btn.active { background-color: #fde68a; border-color: #f7931a; color: #78350f; }

        /* Main Content Styles */
        .content { flex: 1; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
        h1 { color: #f7931a; margin-top: 0; font-size: 24px; text-align: center; margin-bottom: 20px; }
        
        #placeholder-screen { text-align: center; color: #64748b; font-size: 16px; }
        
        #progress { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .question-container { margin-bottom: 20px; font-size: 18px; }
        #question-image { display: none; max-width: 100%; margin: 0 0 20px; border: 1px solid #e2e8f0; border-radius: 5px; }
        .hint { font-size: 14px; color: #64748b; margin: -10px 0 12px; }
        .options button { display: block; width: 100%; padding: 12px; margin: 8px 0; background-color: #e2e8f0; border: 2px solid transparent; border-radius: 5px; cursor: pointer; font-size: 16px; text-align: left; transition: 0.2s; }
        .options button:hover:not(:disabled) { background-color: #cbd5e1; }
        .options button:disabled { cursor: default; }
        .options button.selected { background-color: #fde68a; border-color: #f7931a; }
        .options button.correct { background-color: #4ade80; color: white; border-color: transparent; }
        .options button.wrong { background-color: #f87171; color: white; border-color: transparent; }
        .options button.missed { background-color: #dcfce7; border: 2px dashed #22c55e; color: #166534; }
        #text-answer { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; }
        #text-answer.correct { border-color: #4ade80; background-color: #f0fdf4; }
        #text-answer.wrong { border-color: #f87171; background-color: #fef2f2; }
        .action-btn { display: block; width: 100%; padding: 12px; background-color: #f7931a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .action-btn:hover:not(:disabled) { background-color: #e08214; }
        .action-btn:disabled { background-color: #cbd5e1; cursor: default; }
        #feedback { display: none; margin-top: 15px; padding: 12px; border-radius: 5px; font-size: 15px; line-height: 1.4; }
        #feedback.ok { background-color: #f0fdf4; border-left: 4px solid #4ade80; }
        #feedback.bad { background-color: #fef2f2; border-left: 4px solid #f87171; }
        #result { text-align: center; font-size: 22px; font-weight: bold; margin-top: 20px; line-height: 1.5; color: #333; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Left Sidebar for Lecture Selection -->
        <div class="sidebar">
            <h2>Lectures</h2>
            <div class="lecture-list">
                <button class="lecture-btn" onclick="startQuiz('all', this)">All Lectures</button>
                <button class="lecture-btn" onclick="startQuiz('01', this)">Lecture 1</button>
                <button class="lecture-btn" onclick="startQiuz('02', this)">Lecture 02</button>
                <!-- Add more lecture buttons here as needed:
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content">
            <h1>Blockchain Security Quiz</h1>

            <!-- Initial Placeholder Screen -->
            <div id="placeholder-screen">
                <p>Select a lecture from the sidebar on the left to start the quiz immediately.</p>
            </div>

            <!-- Active Quiz Screen -->
            <div id="quiz" style="display: none;">
                <div id="progress"></div>
                <div class="question-container" id="question">Loading question...</div>
                <img id="question-image" alt="Question image">
                <div class="hint" id="hint"></div>
                <div class="options" id="options"></div>
                <button class="action-btn" id="check-btn" style="display:none;" onclick="submitCurrent()">Check answer</button>
                <div id="feedback"></div>
                <button class="action-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">Next Question</button>
            </div>
            
            <div id="result"></div>
        </div>
    </div>

    <!-- Script placeholders for different lectures -->
    <script src="questions/quizData_01.js"></script>
    <!-- <script src="questions/quizData_02.js"></script> -->
    <script src="questions/quizData_02.js"></script>
    <script>
        const availableLectures = {
            "01": typeof quizData_01 !== 'undefined' ? quizData_01 : [],
            "02": typeof quizData_02 !== 'undefined' ? quizData_02 : []
        };

        let sessionQuestions = [];
        let questionWeights = []; 
        let currentQuestionIndex = 0;
        let activeQuestionPointer = 0;
        let score = 0;
        let totalAnswered = 0;
        let targetQuestionCount = 10;
        let answered = false;
        let selectedKeys = new Set();

        const placeholderScreen = document.getElementById("placeholder-screen");
        const quizScreen = document.getElementById("quiz");
        const progressElement = document.getElementById("progress");
        const questionElement = document.getElementById("question");
        const imageElement = document.getElementById("question-image");
        const hintElement = document.getElementById("hint");
        const optionsElement = document.getElementById("options");
        const checkButton = document.getElementById("check-btn");
        const nextButton = document.getElementById("next-btn");
        const feedbackElement = document.getElementById("feedback");
        const resultElement = document.getElementById("result");

        function startQuiz(selectedLecture, btnElement) {
            // Update active state on sidebar buttons
            document.querySelectorAll('.lecture-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            let pool = [];
            if (selectedLecture === "all") {
                Object.keys(availableLectures).forEach(key => {
                    if (availableLectures[key]) pool = pool.concat(availableLectures[key]);
                });
                if (pool.length === 0 && typeof quizData !== 'undefined') pool = quizData;
            } else {
                pool = availableLectures[selectedLecture] || [];
            }

            if (pool.length === 0) {
                alert("No questions found for the selected lecture!");
                return;
            }

            // Use all questions in the pool since question count option was removed
            const shuffledPool = [...pool].sort(() => Math.random() - 0.5);
            sessionQuestions = shuffledPool;
            targetQuestionCount = sessionQuestions.length;
            
            questionWeights = new Array(sessionQuestions.length).fill(1);

            score = 0;
            totalAnswered = 0;
            currentQuestionIndex = getWeightedRandomIndex();

            placeholderScreen.style.display = "none";
            resultElement.innerHTML = "";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        function getWeightedRandomIndex() {
            const totalWeight = questionWeights.reduce((sum, w) => sum + w, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < questionWeights.length; i++) {
                if (randomNum < questionWeights[i]) return i;
                randomNum -= questionWeights[i];
            }
            return 0;
        }

        function loadQuestion() {
            const q = sessionQuestions[activeQuestionPointer];
            answered = false;
            selectedKeys = new Set();

            progressElement.textContent = `Question ${totalAnswered + 1} of ${targetQuestionCount}`;
            questionElement.textContent = q.question;
            optionsElement.innerHTML = "";
            feedbackElement.style.display = "none";
            feedbackElement.className = "";
            nextButton.style.display = "none";
            checkButton.style.display = "none";
            hintElement.textContent = "";

            if (q.image) {
                imageElement.src = q.image;
                imageElement.style.display = "block";
            } else {
                imageElement.removeAttribute("src");
                imageElement.style.display = "none";
            }

            if (q.type === "text") {
                const input = document.createElement("input");
                input.type = "text";
                input.id = "text-answer";
                input.placeholder = "Type your answer...";
                input.autocomplete = "off";
                input.addEventListener("input", () => { checkButton.disabled = input.value.trim() === ""; });
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !answered && input.value.trim() !== "") submitCurrent();
                });
                optionsElement.appendChild(input);
                checkButton.style.display = "block";
                checkButton.disabled = true;
                input.focus();
                return;
            }

            if (q.type === "multiple") {
                hintElement.textContent = "Select all that apply.";
                checkButton.style.display = "block";
                checkButton.disabled = true;
            }

            Object.entries(q.options).forEach(([key, text]) => {
                const button = document.createElement("button");
                button.textContent = text;
                button.dataset.key = key;
                button.onclick = () => selectOption(key, button);
                optionsElement.appendChild(button);
            });
        }

        function selectOption(key, button) {
            if (answered) return;
            const q = sessionQuestions[activeQuestionPointer];

            if (q.type === "single") {
                submitAnswer([key]);
                return;
            }

            if (selectedKeys.has(key)) {
                selectedKeys.delete(key);
                button.classList.remove("selected");
            } else {
                selectedKeys.add(key);
                button.classList.add("selected");
            }
            checkButton.disabled = selectedKeys.size === 0;
        }

        function submitCurrent() {
            if (answered) return;
            const q = sessionQuestions[activeQuestionPointer];
            if (q.type === "text") {
                submitAnswer(document.getElementById("text-answer").value);
            } else {
                submitAnswer([...selectedKeys]);
            }
        }

        function submitAnswer(given) {
            const q = sessionQuestions[activeQuestionPointer];
            answered = true;
            totalAnswered++;
            const isCorrect = checkAnswer(q, given);
            
            if (isCorrect) {
                score++;
                questionWeights[activeQuestionPointer] = Math.max(1, questionWeights[activeQuestionPointer] - 0.5);
            } else {
                questionWeights[activeQuestionPointer] += 2;
            }

            if (q.type === "text") {
                const input = document.getElementById("text-answer");
                input.disabled = true;
                input.classList.add(isCorrect ? "correct" : "wrong");
            } else {
                const chosen = new Set(given);
                for (const btn of optionsElement.getElementsByTagName("button")) {
                    const key = btn.dataset.key;
                    const isRight = q.correct.includes(key);
                    btn.disabled = true;
                    btn.classList.remove("selected");
                    if (chosen.has(key)) {
                        btn.classList.add(isRight ? "correct" : "wrong");
                    } else if (isRight) {
                        btn.classList.add(q.type === "multiple" ? "missed" : "correct");
                    }
                }
            }

            checkButton.style.display = "none";
            showFeedback(q, isCorrect);

            nextButton.textContent = totalAnswered < targetQuestionCount ? "Next Question" : "Show Result";
            nextButton.style.display = "block";
        }

        function showFeedback(q, isCorrect) {
            feedbackElement.innerHTML = "";
            const title = document.createElement("strong");
            title.textContent = isCorrect ? "Correct! " : "Not quite. ";
            feedbackElement.appendChild(title);

            if (!isCorrect && q.type === "text") {
                feedbackElement.appendChild(document.createTextNode(`Accepted answer: ${q.answers[0]}. `));
            }
            if (q.explanation) {
                feedbackElement.appendChild(document.createTextNode(q.explanation));
            }
            feedbackElement.className = isCorrect ? "ok" : "bad";
            feedbackElement.style.display = "block";
        }

        function nextQuestion() {
            if (totalAnswered < targetQuestionCount) {
                activeQuestionPointer = getWeightedRandomIndex();
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = "none";
            const percent = Math.round((score / totalAnswered) * 100);
            resultElement.innerHTML = `Quiz Completed! <br><br> Your Score: ${score} out of ${totalAnswered} (${percent}%)<br><br><span style="font-size: 16px; font-weight: normal; color: #64748b;">You can now close this tab.</span>`;
        }
    </script>
</body>
</html>
