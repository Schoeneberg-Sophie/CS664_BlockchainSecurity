<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; max-width: 600px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #f7931a; }
        .question-container { margin-bottom: 20px; font-size: 18px; }
        .options button { display: block; width: 100%; padding: 12px; margin: 8px 0; background-color: #e2e8f0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; text-align: left; transition: 0.2s; }
        .options button:hover { background-color: #cbd5e1; }
        .options button.correct { background-color: #4ade80; color: white; }
        .options button.wrong { background-color: #f87171; color: white; }
        #next-btn { display: none; width: 100%; padding: 12px; background-color: #f7931a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        #next-btn:hover { background-color: #e08214; }
        #result { text-align: center; font-size: 20px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Bitcoin Study Quiz</h1>
    <div id="quiz">
        <div class="question-container" id="question">Loading question...</div>
        <div class="options" id="options"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
    <div id="result"></div>

    <script>
        // EDIT YOUR QUESTIONS HERE:
        const quizData = [
            {
                question: "Who creates the locking mechanism (scriptPubKey) when sending Bitcoin?",
                options: ["The recipient", "The sender", "A Bitcoin miner", "The network node"],
                answer: 1 // index 1 means the second option ("The sender") is correct
            },
            {
                question: "What does the digital signature in the unlocking mechanism prove?",
                options: ["That you own the private key", "That the transaction can be reversed", "That you know the sender", "That the public key is secret"],
                answer: 0 // index 0 means the first option is correct
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const nextButton = document.getElementById("next-btn");
        const resultElement = document.getElementById("result");

        function loadQuestion() {
            nextButton.style.display = "none";
            let currentQuiz = quizData[currentQuestionIndex];
            questionElement.innerHTML = `<strong>Question ${currentQuestionIndex + 1}:</strong> ${currentQuiz.question}`;
            optionsElement.innerHTML = "";

            currentQuiz.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.onclick = () => selectOption(index, button);
                optionsElement.appendChild(button);
            });
        }

        function selectOption(selectedIndex, button) {
            let currentQuiz = quizData[currentQuestionIndex];
            const buttons = optionsElement.getElementsByTagName("button");

            for (let btn of buttons) { btn.disabled = true; }

            if (selectedIndex === currentQuiz.answer) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[currentQuiz.answer].classList.add("correct");
            }

            nextButton.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz").style.display = "none";
                resultElement.innerHTML = `Quiz Completed! <br> Your Score: ${score} out of ${quizData.length}`;
            }
        }

        loadQuestion();
    </script>
</body>
</html>
